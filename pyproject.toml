# =============================================================================
# project - pyproject.toml
# =============================================================================

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[dependency-groups]

default = [
    "pandas==3.0.6",
    "numpy==2.5.3"
]


# ---- Development -----------------------------------------------------------

dev = [
    "pre-commit==4.6.2",
]


# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------

[tool.black]

line-length = 130
target-version = ["py314"]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]

line-length = 130
target-version = "py312"

src = [
    "src",
    "tests",
]


[tool.ruff.lint]

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]

known-first-party = [
    "project",
]
